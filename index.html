<script type="text/javascript">
var SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRA5NpvmVUORtp79-12wdq6-x7Ixc_lZScENN81n60VD402B19XjfjOE8MEQopFhpEDqB5amUyW5kPi/pub?gid=1263866120&single=true&output=csv";
var REFRESH_INTERVAL = 60000; // 60 seconds

var DATES = ['2026-05-22','2026-05-23','2026-05-24'];
var IC = {prayer:'ti-building-mosque',food:'ti-tools-kitchen-2',sports:'ti-ball-basketball',program:'ti-speakerphone',logistics:'ti-bus',social:'ti-campfire'};

var PD = [

  [{t:'5:00 am',s:300,d:30,title:'Fajr Salat & Dars',cat:'prayer'},{t:'7:00 am',s:420,d:60,title:'Breakfast',cat:'food',loc:'Patriot HS'},{t:'8:00 am',s:480,d:180,title:'Sports - Block 3',cat:'sports',loc:'Patriot HS',hl:'blue'},{t:'11:00 am',s:660,d:195,title:'Running Lunch',cat:'food',loc:'PHS Cafeteria'},{t:'2:15 pm',s:855,d:45,title:'Zuhr & Asr Salat',cat:'prayer',loc:'Patriot HS'},{t:'3:00 pm',s:900,d:180,title:'Finals Sports Block',cat:'sports',loc:'Patriot HS',hl:'red'},{t:'6:00 pm',s:1080,d:40,title:'Rolling Dinner',cat:'food',loc:'Patriot HS'},{t:'6:40 pm',s:1120,d:185,title:'Closing Session',cat:'program',loc:'Patriot HS',hl:'orange'},{t:'9:45 pm',s:1305,d:30,title:'Maghrib & Isha Salat',cat:'prayer'}]
];

var VD = [
  {name:'Mubarak Mosque',addr:'4555 Ahmadiyya Dr, Chantilly, VA 20151',use:'Accommodation, meals, prayers, Khilafat Day, bonfire',icon:'ti-building-mosque',maps:'https://maps.google.com/?q=4555+Ahmadiyya+Dr+Chantilly+VA'},
  {name:'Patriot High School',addr:'10504 Kettle Run Rd, Nokesville, VA',use:'All sports (Basketball + Soccer), opening & closing sessions',icon:'ti-ball-basketball',maps:'https://maps.google.com/?q=10504+Kettle+Run+Rd+Nokesville+VA'},
  {name:'Rocky Run Middle School',addr:'4700 Stringfellow Rd, Chantilly, VA',use:'Volleyball courts',icon:'ti-ball-volleyball',maps:'https://maps.google.com/?q=4700+Stringfellow+Rd+Chantilly+VA'},
  {name:'Masroor Mosque',addr:'5640 Hoadly Rd, Manassas, VA',use:'Additional venue',icon:'ti-building-mosque',maps:'https://maps.google.com/?q=5640+Hoadly+Rd+Manassas+VA'}
];

var pDay=0, schedDay='Saturday', schedSport='All', pManual=false;
var allGames=[];

function pad(n){return String(n).padStart(2,'0');}
function fmtTime(d){var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap;}
function todayIdx(){var n=new Date(),str=n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());return DATES.indexOf(str);}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes();}
function durLbl(d){if(!d||d>=1440)return'';return d>=60?(Math.floor(d/60)+'h'+(d%60?' '+d%60+'m':'')):(d+'m');}

function updateClock(){
  var n=new Date();
  var c=document.getElementById('m26-clock'),dy=document.getElementById('m26-day');
  if(c)c.textContent=fmtTime(n);
  if(dy)dy.textContent=n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

window.m26tab=function(tab,el){
  document.querySelectorAll('#mist26 .tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  document.getElementById('m26-program').style.display=tab==='program'?'':'none';
  document.getElementById('m26-schedule').style.display=tab==='schedule'?'':'none';
  document.getElementById('m26-venues').style.display=tab==='venues'?'':'none';
  if(tab==='venues')renderV();
  if(tab==='schedule'&&allGames.length===0)fetchSheet();
};

window.m26pday=function(d,el){
  pDay=d;pManual=true;
  document.querySelectorAll('#m26-pdaytabs .day-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderP();
};

window.m26sday=function(day,el){
  schedDay=day;
  el.closest('.day-tabs').querySelectorAll('button').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderS();
};

window.m26sport=function(sport,el){
  schedSport=sport;
  document.querySelectorAll('#mist26 .sport-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderS();
};

/* ── FETCH FROM GOOGLE SHEETS ── */
function fetchSheet(){
  var dot=document.getElementById('m26-rdot');
  var txt=document.getElementById('m26-refresh-txt');
  if(dot)dot.classList.add('syncing');
  if(txt)txt.textContent='Syncing scores...';

  fetch(SHEET_CSV+'&t='+Date.now())
    .then(function(r){return r.text();})
    .then(function(csv){
      allGames=parseCSV(csv);
      renderS();
      if(dot)dot.classList.remove('syncing');
      var now=new Date();
      if(txt)txt.textContent='Updated '+fmtTime(now);
    })
    .catch(function(){
      if(dot)dot.classList.remove('syncing');
      if(txt)txt.textContent='Could not load - check connection';
    });
}

function parseCSV(csv){
  var lines=csv.split('\n');
  var headers=lines[0].split(',').map(function(h){return h.trim().replace(/"/g,'');});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    var vals=lines[i].split(',').map(function(v){return v.trim().replace(/"/g,'');});
    var obj={};
    headers.forEach(function(h,idx){obj[h]=vals[idx]||'';});
    rows.push(obj);
  }
  return rows;
}

/* ── RENDER SCHEDULE ── */
function renderS(){
  var body=document.getElementById('m26-schedbody');
  if(!body)return;
  if(!allGames.length){body.innerHTML='<div class="loading">Loading schedule...</div>';return;}

  var filtered=allGames.filter(function(g){
    var dayMatch=g.day===schedDay;
    var sportMatch=schedSport==='All'||g.sport===schedSport;
    return dayMatch&&sportMatch;
  });

  if(!filtered.length){body.innerHTML='<div class="loading">No matches found</div>';return;}

  /* group by sport then court */
  var groups={};
  filtered.forEach(function(g){
    var key=g.sport+' - '+g.court;
    if(!groups[key])groups[key]={sport:g.sport,court:g.court,games:[]};
    groups[key].games.push(g);
  });

  var sportIcon={Basketball:'🏀',Soccer:'⚽',Volleyball:'🏐'};
  var liveCount=filtered.filter(function(g){return g.status==='live';}).length;

  var html='';
  if(liveCount>0){
    html+='<div style="font-size:12px;color:#a32d2d;background:#fcebeb;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:#e24b4a;display:inline-block;animation:mist-pulse 1.5s infinite"></span>'+liveCount+' game'+(liveCount>1?'s':'')+' live right now</div>';
  }

  Object.keys(groups).sort().forEach(function(key){
    var g=groups[key];
    html+='<div class="court-group"><div class="court-label">'+sportIcon[g.sport]+' '+g.sport+' &mdash; '+g.court+'</div>';
    g.games.forEach(function(m){
      var hasScore=m.score_a!==''&&m.score_b!=='';
      var status=m.status||'upcoming';
      var scoreHTML=hasScore
        ?'<div class="vs-score">'+m.score_a+' <span class="vs-dash">-</span> '+m.score_b+'</div>'
        :'<div class="vs-dash" style="font-size:18px">vs</div>';
      var badgeCls=status==='live'?'s-live':status==='done'?'s-done':'s-up';
      var badgeTxt=status==='live'?'● LIVE':status==='done'?'Final':m.time;
      html+='<div class="match-card '+status+'">'
        +'<div class="match-time">'+m.time+'</div>'
        +'<div><div class="t-name">'+m.team_a+'</div></div>'
        +'<div class="vs-c">'+scoreHTML+'<span class="sbadge '+badgeCls+'">'+badgeTxt+'</span></div>'
        +'<div class="t-right"><div class="t-name">'+m.team_b+'</div></div>'
      +'</div>';
    });
    html+='</div>';
  });
  body.innerHTML=html;
}

/* ── RENDER PROGRAM ── */
function renderP(){
  var rows=PD[pDay]||[];
  var ti=todayIdx(),isToday=(pDay===ti),nm=nowMin();
  var curIdx=-1,nxtIdx=-1;
  if(isToday){
    for(var i=0;i<rows.length;i++){if(rows[i].d>0&&nm>=rows[i].s&&nm<rows[i].s+rows[i].d){curIdx=i;break;}}
    if(curIdx===-1){for(var j=0;j<rows.length;j++){if(rows[j].s>nm){nxtIdx=j;break;}}}
  }
  var bar=document.getElementById('m26-nextbar'),btxt=document.getElementById('m26-nextbar-txt');
  if(isToday&&curIdx!==-1&&curIdx+1<rows.length){bar.style.display='flex';btxt.textContent='Up next: '+rows[curIdx+1].title+' at '+rows[curIdx+1].t;}
  else if(isToday&&nxtIdx!==-1){bar.style.display='flex';btxt.textContent='Up next: '+rows[nxtIdx].title+' at '+rows[nxtIdx].t;}
  else{bar.style.display='none';}

  var html=rows.map(function(r,i){
    var past=isToday&&r.d>0&&nm>=r.s+r.d;
    var curr=i===curIdx;
    var rc='tl-row'+(past?' past':'')+(curr?' current':'');
    var nb=curr?'<div class="now-pill"><span class="now-dot"></span>Happening now</div>':'';
    var tc='tl-title'+(r.hl==='orange'?' hl-orange':r.hl==='blue'?' hl-blue':r.hl==='red'?' hl-red':'');
    var sub=r.loc?'<div class="tl-sub"><i class="ti ti-map-pin" style="font-size:10px;margin-right:2px" aria-hidden="true"></i>'+r.loc+'</div>':'';
    return '<div class="'+rc+'"><div class="tl-time">'+r.t+'</div><div class="tl-dot '+r.cat+'"><i class="ti '+IC[r.cat]+'" aria-hidden="true"></i></div><div class="tl-body">'+nb+'<div class="'+tc+'">'+r.title+'</div>'+sub+'</div></div>';
  }).join('');
  var body=document.getElementById('m26-progbody');
  if(body)body.innerHTML=html;
  setTimeout(function(){var c=document.querySelector('#mist26 .tl-row.current');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});},120);
}

/* ── RENDER VENUES ── */
function renderV(){
  var body=document.getElementById('m26-venuesbody');
  if(!body)return;
  body.innerHTML=VD.map(function(v){
    return '<div class="venue-card"><div class="venue-icon"><i class="ti '+v.icon+'" aria-hidden="true"></i></div><div><div class="venue-name">'+v.name+'</div><div class="venue-addr">'+v.addr+'</div><div class="venue-addr" style="margin-bottom:6px;color:#aaa">'+v.use+'</div>'+(v.maps?'<a href="'+v.maps+'" target="_blank" rel="noopener" class="venue-dir"><i class="ti ti-map" style="font-size:12px" aria-hidden="true"></i> Get directions</a>':'')+'</div></div>';
  }).join('');
}

/* ── INIT ── */
function initDayTabs(){
  var ti=todayIdx();
  var btns=document.querySelectorAll('#m26-pdaytabs .day-btn');
  btns.forEach(function(b,i){if(i===ti)b.classList.add('today');});
  var start=ti>=0?ti:0;
  if(!pManual){pDay=start;btns.forEach(function(b){b.classList.remove('active');});if(btns[start])btns[start].classList.add('active');}
  else{if(btns[0])btns[0].classList.add('active');}
}

function tick(){updateClock();renderP();}

function m26Start(){
  if(window._m26done)return;
  window._m26done=true;
  initDayTabs();
  tick();
  setInterval(tick,60000);
  fetchSheet();
  setInterval(fetchSheet,REFRESH_INTERVAL);
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',m26Start);}
else{m26Start();}
</script>
